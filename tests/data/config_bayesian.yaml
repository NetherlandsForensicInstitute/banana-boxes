# MCMC settings
mcmc_settings:
  mcmc_draw_count: 1000
  mcmc_chain_count: 4
  mcmc_tune_count: 1000
  mcmc_prior_factor: 5
  mcmc_target_accept: 0.9
  mcmc_save_posteriors: False
  mcmc_priors:
    weights:
      mu: 'normal'
      sigma: 'half-cauchy'
    concentrations:
      mu: 'normal'
      sigma: 'half-cauchy'