output_folder: 'results'

# Number of boxes and samples
box_count: 1000
presence_sample_count: 300
weight_sample_count: 5
concentration_sample_count: 10
repeated_concentration_sample_count: 3

# Parameters for the ground truth distributions
presence_real_p: 0.98
weight_real_mu: 0.320
weight_real_sigma: 0.010
concentration_real_mu: 0.25
concentration_real_sigma: 0.01
repeated_concentration_real_sigma: 0.025

# MCMC settings
mcmc_settings:
  mcmc_draw_count: 1000
  mcmc_chain_count: 4
  mcmc_tune_count: 1000
  mcmc_prior_factor: 5
  mcmc_target_accept: 0.9
  mcmc_save_posteriors: False
  mcmc_priors:
    weights:
      mu: 'normal'
      sigma: 'half-cauchy'
    concentrations:
      mu: 'normal'
      sigma: 'half-cauchy'

# Simulation values
simulation_count: 1000
alpha: 0.05
measurement_types: 'weights_presences_concentrations'
experiment: 'default'
random_seed:
clear_cache: True
